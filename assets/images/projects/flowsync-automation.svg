<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a"/>
      <stop offset="50%" stop-color="#0b1728"/>
      <stop offset="100%" stop-color="#050a12"/>
    </linearGradient>
    <radialGradient id="flowGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00bfff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00bfff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridPattern2" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 191, 255, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#flowBg)"/>
  <rect width="800" height="450" fill="url(#gridPattern2)"/>
  <circle cx="400" cy="225" r="230" fill="url(#flowGlow)"/>

  <!-- Workflow Graph Visualization -->
  <g transform="translate(100, 75)">
    <!-- Pipeline Connecting Paths -->
    <path d="M 100 150 C 180 150, 180 80, 260 80 L 340 80 C 420 80, 420 150, 500 150" fill="none" stroke="rgba(0, 191, 255, 0.4)" stroke-width="3" stroke-dasharray="6,4"/>
    <path d="M 100 150 C 180 150, 180 220, 260 220 L 340 220 C 420 220, 420 150, 500 150" fill="none" stroke="rgba(0, 255, 255, 0.7)" stroke-width="3"/>
    
    <!-- Pulse Packets along path -->
    <circle cx="210" cy="195" r="5" fill="#00ffff"/>
    <circle cx="390" cy="220" r="5" fill="#00ffff"/>

    <!-- Step 1: Webhook Trigger Card -->
    <g transform="translate(20, 110)">
      <rect width="140" height="80" rx="10" fill="#0e1d35" stroke="#00bfff" stroke-width="2"/>
      <circle cx="30" cy="30" r="14" fill="rgba(0, 191, 255, 0.2)"/>
      <path d="M 25 30 L 35 30 M 30 25 L 30 35" stroke="#00ffff" stroke-width="2"/>
      <text x="52" y="34" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Webhook</text>
      <text x="24" y="60" fill="#88a0c0" font-family="system-ui, sans-serif" font-size="11">Lead Ingested</text>
    </g>

    <!-- Step 2A: Enrichment Logic -->
    <g transform="translate(240, 40)">
      <rect width="150" height="80" rx="10" fill="#0e1d35" stroke="rgba(0, 191, 255, 0.5)" stroke-width="1.5"/>
      <circle cx="30" cy="30" r="14" fill="rgba(0, 191, 255, 0.15)"/>
      <text x="52" y="34" fill="#e0f0ff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">AI Scoring</text>
      <text x="24" y="60" fill="#88a0c0" font-family="system-ui, sans-serif" font-size="11">Intent Categorized</text>
    </g>

    <!-- Step 2B: CRM & DB Routing -->
    <g transform="translate(240, 180)">
      <rect width="150" height="80" rx="10" fill="#0e1d35" stroke="#00ffff" stroke-width="2"/>
      <circle cx="30" cy="30" r="14" fill="rgba(0, 255, 255, 0.25)"/>
      <text x="52" y="34" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">CRM Sync</text>
      <text x="24" y="60" fill="#88a0c0" font-family="system-ui, sans-serif" font-size="11">Pipeline Updated</text>
    </g>

    <!-- Step 3: Notification & Action -->
    <g transform="translate(450, 110)">
      <rect width="140" height="80" rx="10" fill="#0e1d35" stroke="#00bfff" stroke-width="2"/>
      <circle cx="30" cy="30" r="14" fill="rgba(0, 191, 255, 0.2)"/>
      <text x="52" y="34" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Dispatch</text>
      <text x="24" y="60" fill="#00ffff" font-family="system-ui, sans-serif" font-size="11">Instant Routing</text>
    </g>
  </g>

  <!-- Status Bar -->
  <g transform="translate(250, 380)">
    <rect width="300" height="36" rx="18" fill="rgba(10, 25, 47, 0.9)" stroke="rgba(0, 191, 255, 0.3)"/>
    <circle cx="20" cy="18" r="5" fill="#00ff88"/>
    <text x="35" y="23" fill="#a0c0e0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Active Workflows: 48 | Error Rate: 0.00%</text>
  </g>
</svg>

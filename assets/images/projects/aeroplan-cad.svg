<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cadBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05101f"/>
      <stop offset="60%" stop-color="#08182f"/>
      <stop offset="100%" stop-color="#030a14"/>
    </linearGradient>
    <pattern id="cadGridSmall" width="15" height="15" patternUnits="userSpaceOnUse">
      <path d="M 15 0 L 0 0 0 15" fill="none" stroke="rgba(0, 191, 255, 0.08)" stroke-width="0.5"/>
    </pattern>
    <pattern id="cadGridLarge" width="75" height="75" patternUnits="userSpaceOnUse">
      <rect width="75" height="75" fill="url(#cadGridSmall)"/>
      <path d="M 75 0 L 0 0 0 75" fill="none" stroke="rgba(0, 191, 255, 0.18)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#cadBg)"/>
  <rect width="800" height="450" fill="url(#cadGridLarge)"/>

  <!-- CAD Technical Schematics Layout -->
  <g transform="translate(100, 45)">
    <!-- Main Drawing Border with Title Block -->
    <rect width="600" height="360" fill="none" stroke="#00ffff" stroke-width="2"/>
    <rect x="5" y="5" width="590" height="350" fill="none" stroke="rgba(0, 191, 255, 0.4)" stroke-width="1"/>
    
    <!-- Title Block in Lower Right -->
    <g transform="translate(380, 270)">
      <rect width="215" height="85" fill="#09182d" stroke="#00ffff" stroke-width="1.5"/>
      <line x1="0" y1="28" x2="215" y2="28" stroke="rgba(0, 191, 255, 0.3)"/>
      <line x1="0" y1="56" x2="215" y2="56" stroke="rgba(0, 191, 255, 0.3)"/>
      <line x1="100" y1="28" x2="100" y2="85" stroke="rgba(0, 191, 255, 0.3)"/>
      <text x="10" y="19" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">PROJECT: AEROPLAN-2D</text>
      <text x="10" y="45" fill="#88a0c0" font-family="system-ui, sans-serif" font-size="9">SCALE: 1:50</text>
      <text x="110" y="45" fill="#88a0c0" font-family="system-ui, sans-serif" font-size="9">DWG NO: XES-042</text>
      <text x="10" y="73" fill="#00ffff" font-family="system-ui, sans-serif" font-size="9">STATUS: APPROVED</text>
      <text x="110" y="73" fill="#88a0c0" font-family="system-ui, sans-serif" font-size="9">REV: 03.1</text>
    </g>

    <!-- Technical Geometric Drafting Profiles -->
    <!-- Architectural plan outline -->
    <path d="M 40 50 L 320 50 L 320 180 L 220 180 L 220 280 L 40 280 Z" fill="rgba(0, 191, 255, 0.04)" stroke="#00ffff" stroke-width="2"/>
    
    <!-- Internal Partitions -->
    <line x1="40" y1="140" x2="220" y2="140" stroke="#00bfff" stroke-width="1.5"/>
    <line x1="130" y1="50" x2="130" y2="140" stroke="#00bfff" stroke-width="1.5"/>
    <line x1="130" y1="140" x2="130" y2="280" stroke="#00bfff" stroke-width="1.5"/>
    
    <!-- Door Swings (CAD arcs) -->
    <path d="M 130 90 A 30 30 0 0 1 100 120 L 130 120 Z" fill="none" stroke="#00ff88" stroke-width="1.5" stroke-dasharray="3,3"/>
    <path d="M 130 200 A 30 30 0 0 1 100 230 L 130 230 Z" fill="none" stroke="#00ff88" stroke-width="1.5" stroke-dasharray="3,3"/>

    <!-- Dimension Lines -->
    <g stroke="#ffbd2e" stroke-width="1">
      <!-- Top horizontal dimension -->
      <line x1="40" y1="30" x2="320" y2="30"/>
      <line x1="40" y1="24" x2="40" y2="36"/>
      <line x1="320" y1="24" x2="320" y2="36"/>
      <!-- Left vertical dimension -->
      <line x1="20" y1="50" x2="20" y2="280"/>
      <line x1="14" y1="50" x2="26" y2="50"/>
      <line x1="14" y1="280" x2="26" y2="280"/>
    </g>
    <text x="170" y="24" text-anchor="middle" fill="#ffbd2e" font-family="system-ui, sans-serif" font-size="10" font-weight="600">8,400 mm</text>
    <text x="14" y="170" fill="#ffbd2e" font-family="system-ui, sans-serif" font-size="10" font-weight="600" transform="rotate(-90 14,170)">6,900 mm</text>

    <!-- Crosshair Center Mark -->
    <circle cx="480" cy="130" r="40" fill="none" stroke="#00ffff" stroke-width="1.5"/>
    <circle cx="480" cy="130" r="2" fill="#00ffff"/>
    <line x1="420" y1="130" x2="540" y2="130" stroke="#00ffff" stroke-width="1" stroke-dasharray="8,4,2,4"/>
    <line x1="480" y1="70" x2="480" y2="190" stroke="#00ffff" stroke-width="1" stroke-dasharray="8,4,2,4"/>
    <text x="480" y="215" text-anchor="middle" fill="#88a0c0" font-family="system-ui, sans-serif" font-size="10">SECTION DETAIL A-A</text>
  </g>
</svg>

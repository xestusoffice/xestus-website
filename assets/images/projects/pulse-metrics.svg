<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="pulseBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a"/>
      <stop offset="60%" stop-color="#0b172a"/>
      <stop offset="100%" stop-color="#050a12"/>
    </linearGradient>
    <linearGradient id="chartArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00ffff" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#pulseBg)"/>

  <!-- Analytics Dashboard Layout -->
  <g transform="translate(80, 45)">
    <!-- Top Stat Widgets -->
    <g transform="translate(0, 0)">
      <rect width="190" height="85" rx="10" fill="#0f2038" stroke="rgba(0, 191, 255, 0.25)"/>
      <text x="20" y="32" fill="#88a0c0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">THROUGHPUT</text>
      <text x="20" y="65" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="800">4.8M <tspan fill="#00ff88" font-size="13" font-weight="600">+14%</tspan></text>
    </g>

    <g transform="translate(210, 0)">
      <rect width="190" height="85" rx="10" fill="#0f2038" stroke="rgba(0, 191, 255, 0.25)"/>
      <text x="20" y="32" fill="#88a0c0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">AVG RESPONSE</text>
      <text x="20" y="65" fill="#00ffff" font-family="system-ui, sans-serif" font-size="24" font-weight="800">42ms</text>
    </g>

    <g transform="translate(420, 0)">
      <rect width="220" height="85" rx="10" fill="#0f2038" stroke="rgba(0, 191, 255, 0.25)"/>
      <text x="20" y="32" fill="#88a0c0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">UPTIME SLA</text>
      <text x="20" y="65" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="800">99.99%</text>
      <circle cx="180" cy="55" r="6" fill="#00ff88"/>
    </g>

    <!-- Main Chart Panel -->
    <g transform="translate(0, 105)">
      <rect width="400" height="250" rx="12" fill="#0c182c" stroke="rgba(0, 191, 255, 0.3)"/>
      <text x="25" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Real-Time Ingestion Telemetry</text>
      
      <!-- Chart Grid Lines -->
      <line x1="30" y1="80" x2="370" y2="80" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4,4"/>
      <line x1="30" y1="130" x2="370" y2="130" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4,4"/>
      <line x1="30" y1="180" x2="370" y2="180" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4,4"/>
      <line x1="30" y1="220" x2="370" y2="220" stroke="rgba(0, 191, 255, 0.2)"/>

      <!-- Area fill and line -->
      <path d="M 30 190 Q 70 170, 110 140 T 190 120 T 270 80 T 350 55 L 350 220 L 30 220 Z" fill="url(#chartArea)"/>
      <path d="M 30 190 Q 70 170, 110 140 T 190 120 T 270 80 T 350 55" fill="none" stroke="#00ffff" stroke-width="3"/>
      
      <!-- Chart Dots -->
      <circle cx="190" cy="120" r="5" fill="#00ffff"/>
      <circle cx="270" cy="80" r="5" fill="#00ffff"/>
      <circle cx="350" cy="55" r="6" fill="#ffffff" stroke="#00ffff" stroke-width="2"/>
    </g>

    <!-- Circular Gauge & Breakdown Panel -->
    <g transform="translate(420, 105)">
      <rect width="220" height="250" rx="12" fill="#0c182c" stroke="rgba(0, 191, 255, 0.3)"/>
      <text x="20" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Cluster Load</text>
      
      <!-- Circular Gauge -->
      <circle cx="110" cy="115" r="50" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="12"/>
      <circle cx="110" cy="115" r="50" fill="none" stroke="#00bfff" stroke-width="12" stroke-dasharray="230, 314" stroke-linecap="round"/>
      <text x="110" y="122" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">73%</text>

      <!-- Sub metrics -->
      <rect x="25" y="185" width="170" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
      <rect x="25" y="185" width="125" height="6" rx="3" fill="#00ffff"/>
      <text x="25" y="205" fill="#88a0c0" font-family="system-ui, sans-serif" font-size="11">Memory Utilization: 73%</text>
      <text x="25" y="222" fill="#88a0c0" font-family="system-ui, sans-serif" font-size="11">CPU Core Idle: 86%</text>
    </g>
  </g>
</svg>
